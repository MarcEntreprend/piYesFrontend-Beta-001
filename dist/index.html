<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>piYès</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #830ad1;
        --primary-dark: #6d08af;
        --bg-color: #ffffff;
        --card-bg: #ffffff;
        --text-main: #111111;
        --text-secondary: #666666;
        --border-color: #f0f0f0;
        --bubble-bg: #f4f4f4;
        --nav-active: #830ad1;
        --nav-inactive: #9ca3af;
        --base-font-size: 16px;
        /* Aliases pour index.css */
        --theme-bg: #ffffff;
        --theme-card-bg: #ffffff;
        --theme-text-main: #111111;
        --theme-text-secondary: #666666;
        --theme-primary-text: #830ad1;
        --theme-primary-bg: #830ad1;
        --theme-bubble-bg: #f4f4f4;
        --theme-border: #f0f0f0;
      }

      [data-theme="dark"] {
        --primary-color: #830ad1;
        --primary-dark: #6d08af;
        --bg-color: #000000;
        --card-bg: #121212;
        --text-main: #ffffff;
        --text-secondary: #a0a0a0;
        --border-color: #222222;
        --bubble-bg: #262626;
        --nav-active: #830ad1;
        --nav-inactive: #4b5563;
        --theme-bg: #000000;
        --theme-card-bg: #121212;
        --theme-text-main: #ffffff;
        --theme-text-secondary: #a0a0a0;
        --theme-primary-text: #a855f7;
        --theme-primary-bg: #830ad1;
        --theme-bubble-bg: #1a1a1a;
        --theme-border: #262626;
      }

      [data-theme="bleu_cendre"] {
        --primary-color: #3390ec;
        --primary-dark: #1c6fb8;
        --bg-color: #0e1621;
        --card-bg: #17212b;
        --text-main: #ffffff;
        --text-secondary: #a0aab6;
        --border-color: #2a2f38;
        --bubble-bg: #1c2733;
        --nav-active: #3390ec;
        --nav-inactive: #6c7883;
        --theme-bg: #0e1621;
        --theme-card-bg: #17212b;
        --theme-text-main: #ffffff;
        --theme-text-secondary: #a0aab6;
        --theme-primary-text: #3390ec;
        --theme-primary-bg: #3390ec;
        --theme-bubble-bg: #1c2733;
        --theme-border: #2a2f38;
      }
      /* Font Size scaling logic using root font-size which scales all REM units */
      [data-font-size="small"] {
        --base-font-size: 14px;
      }
      [data-font-size="default"] {
        --base-font-size: 16px;
      }
      [data-font-size="large"] {
        --base-font-size: 18px;
      }
      [data-font-size="extra-large"] {
        --base-font-size: 20px;
      }

      html {
        font-size: var(--base-font-size);
        transition: font-size 0.3s ease-in-out;
      }

      body {
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
        background-color: var(--bg-color);
        color: var(--text-main);
        /* Transition de base pour le body */
        transition:
          background-color 0.4s ease-in-out,
          color 0.4s ease-in-out;
      }

      /* Rotating Text Styles */
      .text-rotate {
        display: flex;
        flex-wrap: wrap;
        white-space: pre-wrap;
        position: relative;
      }

      .text-rotate-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .text-rotate-word {
        display: inline-flex;
      }

      .text-rotate-lines {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .text-rotate-element {
        display: inline-block;
      }

      .text-rotate-space {
        white-space: pre;
      }

      .bank-logo-fixed img {
        width: 24px;
        height: 24px;
        object-fit: contain;
        border-radius: 9999px; /* pour garder le style circulaire */
      }

      /* Transition fluide pour tous les éléments thémés */
      .theme-primary-bg,
      .theme-card-bg,
      .theme-bubble-bg,
      .theme-text-main,
      .theme-text-secondary,
      .theme-primary-text,
      .theme-border,
      nav,
      header,
      input,
      textarea,
      select,
      button {
        transition:
          background-color 0.4s ease-in-out,
          color 0.4s ease-in-out,
          border-color 0.4s ease-in-out,
          box-shadow 0.4s ease-in-out,
          fill 0.4s ease-in-out,
          stroke 0.4s ease-in-out;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .shimmer {
        background: linear-gradient(
          90deg,
          var(--border-color) 25%,
          var(--bubble-bg) 50%,
          var(--border-color) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      /* Bottom Sheet Exit Animation: Bounce Up -> Slide Down */
      @keyframes bottomSheetBounceOut {
        0% {
          transform: translateY(0);
        }
        15% {
          transform: translateY(-20px);
        }
        100% {
          transform: translateY(100%);
        }
      }

      .animate-bottom-sheet-out {
        animation: bottomSheetBounceOut 0.45s cubic-bezier(0.36, 0, 0.66, -0.56)
          forwards;
      }

      .animate-fade-out {
        animation: fade-out 0.3s ease forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      .theme-primary-bg {
        background-color: var(--primary-color);
      }
      .theme-primary-text {
        color: var(--primary-color);
      }
      .theme-card-bg {
        background-color: var(--card-bg);
      }
      .theme-text-main {
        color: var(--text-main);
      }
      .theme-text-secondary {
        color: var(--text-secondary);
      }
      .theme-border {
        border-color: var(--border-color);
      }
      .theme-bubble-bg {
        background-color: var(--bubble-bg);
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BXkt30rz.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CQErcAeu.css" />
  </head>
  <body class="bg-(--bg-color)">
    <div id="root"></div>
  </body>
</html>
