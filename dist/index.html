<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>piYès</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #4318FF;
            --primary-dark: #3210C0;
            --bg-color: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-secondary: #666666;
            --border-color: #F0F0F0;
            --bubble-bg: #F4F4F4;
            --nav-active: #4318FF;
            --nav-inactive: #9CA3AF;
            --base-font-size: 16px;
            /* Aliases pour index.css */
            --theme-bg: #FFFFFF;
            --theme-card-bg: #FFFFFF;
            --theme-text-main: #111111;
            --theme-text-secondary: #666666;
            --theme-primary-text: #4318FF;
            --theme-primary-bg: #4318FF;
            --theme-bubble-bg: #F4F4F4;
            --theme-border: #F0F0F0;
        }

        [data-theme='dark'] {
            --primary-color: #5E32FF;
            --primary-dark: #4318FF;
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #FFFFFF;
            --text-secondary: #A0A0A0;
            --border-color: #222222;
            --bubble-bg: #262626;
            --nav-active: #5E32FF;
            --nav-inactive: #4B5563;
            --theme-bg: #000000;
            --theme-card-bg: #121212;
            --theme-text-main: #FFFFFF;
            --theme-text-secondary: #A0A0A0;
            --theme-primary-text: #5E32FF;
            --theme-primary-bg: #4318FF;
            --theme-bubble-bg: #1A1A1A;
            --theme-border: #262626;
        }

        [data-theme='bleu_cendre'] {
            --primary-color: #3390EC;
            --primary-dark: #1C6FB8;
            --bg-color: #0E1621;
            --card-bg: #17212B;
            --text-main: #FFFFFF;
            --text-secondary: #A0AAB6;
            --border-color: #2A2F38;
            --bubble-bg: #1C2733;
            --nav-active: #3390EC;
            --nav-inactive: #6C7883;
            --theme-bg: #0E1621;
            --theme-card-bg: #17212B;
            --theme-text-main: #FFFFFF;
            --theme-text-secondary: #A0AAB6;
            --theme-primary-text: #3390EC;
            --theme-primary-bg: #3390EC;
            --theme-bubble-bg: #1C2733;
            --theme-border: #2A2F38;
        }

        /* Font Size scaling logic using root font-size which scales all REM units */
        [data-font-size='small'] {
            --base-font-size: 14px;
        }

        [data-font-size='default'] {
            --base-font-size: 16px;
        }

        [data-font-size='large'] {
            --base-font-size: 18px;
        }

        [data-font-size='extra-large'] {
            --base-font-size: 20px;
        }

        html {
            font-size: var(--base-font-size);
            transition: font-size 0.3s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Transition de base pour le body */
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out;
        }

        /* Rotating Text Styles */
        .text-rotate {
            display: flex;
            flex-wrap: wrap;
            white-space: pre-wrap;
            position: relative;
        }

        .text-rotate-sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .text-rotate-word {
            display: inline-flex;
        }

        .text-rotate-lines {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .text-rotate-element {
            display: inline-block;
        }

        .text-rotate-space {
            white-space: pre;
        }



        .bank-logo-fixed img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 9999px;
            /* pour garder le style circulaire */
        }


        /* Transition fluide pour tous les éléments thémés */
        .theme-primary-bg,
        .theme-card-bg,
        .theme-bubble-bg,
        .theme-text-main,
        .theme-text-secondary,
        .theme-primary-text,
        .theme-border,
        nav,
        header,
        input,
        textarea,
        select,
        button {
            transition: background-color 0.4s ease-in-out,
                color 0.4s ease-in-out,
                border-color 0.4s ease-in-out,
                box-shadow 0.4s ease-in-out,
                fill 0.4s ease-in-out,
                stroke 0.4s ease-in-out;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .shimmer {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--bubble-bg) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        /* Bottom Sheet Exit Animation: Bounce Up -> Slide Down */
        @keyframes bottomSheetBounceOut {
            0% {
                transform: translateY(0);
            }

            15% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .animate-bottom-sheet-out {
            animation: bottomSheetBounceOut 0.45s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
        }

        .animate-fade-out {
            animation: fade-out 0.3s ease forwards;
        }

        @keyframes fade-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .theme-primary-bg {
            background-color: var(--primary-color);
        }

        .theme-primary-text {
            color: var(--primary-color);
        }

        .theme-card-bg {
            background-color: var(--card-bg);
        }

        .theme-text-main {
            color: var(--text-main);
        }

        .theme-text-secondary {
            color: var(--text-secondary);
        }

        .theme-border {
            border-color: var(--border-color);
        }

        .theme-bubble-bg {
            background-color: var(--bubble-bg);
        }
    </style>

</head>
